<title>Salas del Camino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: lienzo infinito sobre el vacío. Las salas son marcos flotantes (estilo editor de diseño) que se recorren arrastrando y con zoom.
   Capas fijas encima: barra superior, panel de capas, inspector, barra de herramientas y minimapa. Diseño deliberadamente oscuro en ambos temas. */
:root{
  --vacio:#030405;        /* el fondo infinito */
  --punto:#1a1f27;        /* retícula de puntos */
  --marco:#0b0e13;        /* superficie de marcos */
  --marco-2:#11151c;      /* superficies elevadas dentro del marco */
  --borde:#1d232d;
  --borde-2:#2a3240;
  --texto:#e7ebf1;
  --tenue:#7f8a99;
  --sel:#3d7bff;          /* azul de selección */
  --flecha:#f5c518;       /* amarillo de la flecha del Camino */
  --vivo:#3ddc97; --caliente:#ff5d5d; --tibio:#ffab3d;
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--vacio);color:var(--texto);font:14px/1.45 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* Vista y mundo */
#vista{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--vacio);background-image:radial-gradient(var(--punto) 1.1px,transparent 1.2px)}
#vista.arrastrando{cursor:grabbing}
#mundo{position:absolute;left:0;top:0;transform-origin:0 0}
#mundo.moviendo{will-change:transform}

/* Marcos */
.marco{position:absolute;background:var(--marco);border:1px solid var(--borde);border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.marco:hover{border-color:var(--borde-2)}
.marco.sel{outline:calc(2px * var(--iz,1)) solid var(--sel);outline-offset:0}
.etiqueta{position:absolute;left:0;bottom:100%;transform-origin:0 100%;transform:scale(var(--iz,1));padding-bottom:6px;white-space:nowrap;
  font:500 12px/1 var(--f-ui);color:var(--tenue);cursor:pointer;display:flex;gap:6px;align-items:center}
.marco.sel .etiqueta,.etiqueta:hover{color:var(--sel)}
.etiqueta svg{width:11px;height:11px}
.grupo-titulo{position:absolute;font:800 72px/1 var(--f-ui);letter-spacing:-.03em;color:var(--texto);white-space:nowrap;pointer-events:none}
.grupo-titulo small{display:block;font:500 18px/1.4 var(--f-mono);letter-spacing:.04em;color:var(--tenue);margin-top:12px;text-transform:uppercase}
.grupo-titulo .ok{color:var(--vivo)}

/* Cabecera interna de marco */
.mcab{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--borde)}
.mcab h2{margin:0;font:700 20px/1.1 var(--f-ui);letter-spacing:-.01em}
.mcab .meta{font:500 12px/1.3 var(--f-mono);color:var(--tenue);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.vivo{display:inline-flex;align-items:center;gap:6px;color:var(--vivo);font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.vivo::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:latido 2s ease-in-out infinite}
.vivo.off{color:var(--tenue)}.vivo.off::before{animation:none;box-shadow:none}
@keyframes latido{50%{opacity:.3}}
.obra-tag{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--flecha);border:1px solid color-mix(in srgb,var(--flecha) 45%,transparent);padding:5px 8px;border-radius:3px}

/* Plano */
.plano{position:relative;width:1200px;height:600px;overflow:hidden}
.plano svg{position:absolute;inset:0;width:100%;height:100%}
.nombre{font:600 11px var(--f-ui);fill:#fff}
.pant-t{font:600 11px var(--f-mono);fill:#7fffc4;letter-spacing:.14em}
.pant-n{font:600 13px var(--f-mono);fill:var(--flecha)}
.cartel{font:600 26px var(--f-mono);fill:var(--flecha);letter-spacing:.18em}
.cartel-sub{font:500 12px var(--f-mono);fill:var(--tenue);letter-spacing:.06em}
.glow{animation:tecleo 1.4s steps(3) infinite}
@keyframes tecleo{50%{opacity:.45}}
.barrido{transform-origin:0 0;animation:gira 3s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cursor-b{animation:parpadeo 1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.bocadillo{position:absolute;transform:translate(-50%,calc(-100% - 22px));background:#0f141b;color:var(--texto);border:1px solid var(--borde-2);
  padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.35;width:max-content;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;z-index:2}
.bocadillo b{display:block;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.bocadillo.abajo{transform:translate(-50%,26px)}

/* Métricas y podio */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--borde)}
.kpi{padding:18px 20px;border-right:1px solid var(--borde)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font:700 34px/1 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{display:block;margin-top:8px;font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.podio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 20px 20px}
.ganador{background:var(--marco-2);border:1px solid var(--borde);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.ganador:hover{border-color:var(--sel)}
.ganador .pos{display:flex;justify-content:space-between;align-items:center;font:600 12px/1 var(--f-mono);color:var(--tenue)}
.ganador .total{font:800 40px/1 var(--f-ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ganador .total small{display:block;font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);margin-top:6px}
.ganador .tit{font-weight:600;line-height:1.3}
.ganador .desg{font:12px/1.5 var(--f-mono);color:var(--tenue)}
.seccion-t{padding:16px 20px 0;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}

/* Listado */
.filtros{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;border-bottom:1px solid var(--borde);align-items:center}
.chip{border:1px solid var(--borde-2);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:#fff}
.chip i{font:normal 11px/1 var(--f-mono);opacity:.7}
.campo{background:var(--marco-2);border:1px solid var(--borde-2);border-radius:6px;padding:6px 10px;font-size:13px}
.buscar{flex:1 1 180px;min-width:0}
.btn{background:var(--marco-2);border:1px solid var(--borde-2);border-radius:6px;padding:6px 11px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--sel)}
.btn.prim{background:var(--sel);border-color:var(--sel);color:#fff}
.btn[aria-pressed="true"]{background:#1b2a4a;border-color:var(--sel)}
.lista{list-style:none;margin:0;padding:8px 12px 14px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:14px 10px;border-bottom:1px solid var(--borde);cursor:pointer;border-radius:6px}
.item:hover{background:var(--marco-2)}
.item.sel{background:#101a2e;box-shadow:inset 0 0 0 1px var(--sel)}
.buzz{text-align:center}
.buzz b{display:block;font:800 26px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.buzz span{display:block;margin-top:5px;height:3px;border-radius:2px;background:var(--borde-2);overflow:hidden}
.buzz span i{display:block;height:100%}
.buzz small{display:block;margin-top:5px;font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.imeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:12px/1.3 var(--f-mono);color:var(--tenue)}
.plat{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--texto)}
.plat::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.nuevo{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#000;background:var(--flecha);padding:3px 6px;border-radius:3px}
.item h3{margin:6px 0 4px;font:600 16px/1.3 var(--f-ui);text-wrap:balance}
.item p{margin:0;color:#b9c1cc;font-size:13.5px}
.mini-met{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font:12px/1.2 var(--f-mono);color:var(--tenue)}
.mini-met b{color:var(--texto);font-weight:600}
.mas{display:block;width:calc(100% - 24px);margin:4px 12px 16px}
.vacio{padding:28px 20px;color:var(--tenue)}
.vacio b{display:block;color:var(--texto);font:600 16px/1.3 var(--f-ui);margin-bottom:6px}

/* Bitácora y equipo */
.equipo{display:grid;gap:2px;padding:10px 12px;border-bottom:1px solid var(--borde)}
.agente{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:6px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--f-mono);color:#fff;box-shadow:0 0 12px var(--c);background:var(--c)}
.agente .n{font-weight:600;font-size:13.5px}
.agente .r{font-size:12px;color:var(--tenue);line-height:1.3}
.agente .a{font:11.5px/1.3 var(--f-mono);color:var(--tenue);text-align:right}
.bit{list-style:none;margin:0;padding:12px 20px 18px;display:grid;gap:14px}
.bit li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;font-size:13px;line-height:1.4}
.bit li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--tenue));margin-top:6px}
.bit time{display:block;font:11.5px/1.3 var(--f-mono);color:var(--tenue);margin-bottom:2px}

/* Capas fijas */
.capa{position:fixed;z-index:10;background:rgba(10,12,16,.92);border:1px solid var(--borde);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#barra{top:0;left:0;right:0;height:calc(48px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;border-width:0 0 1px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.logo svg{flex:none}
.ruta{color:var(--tenue);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ruta b{color:var(--texto);font-weight:500}
.centro{margin:0 auto;display:flex;gap:12px;align-items:center;font:12px/1 var(--f-mono);color:var(--tenue);white-space:nowrap}
.avatares{display:flex;padding-left:6px}
.avatares .av{width:26px;height:26px;margin-left:-6px;border:2px solid #0a0c10;font-size:10px;box-shadow:none}
#zoomtxt{font:500 12px/1 var(--f-mono);color:var(--tenue);min-width:44px;text-align:right}
#capas{top:calc(60px + env(safe-area-inset-top,0px));left:12px;width:236px;border-radius:8px;padding:10px 6px}
#capas h4{margin:4px 10px 8px;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.capa-it{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:5px;padding:7px 10px;cursor:pointer;text-align:left;font-size:13px}
.capa-it:hover{background:#151a22}
.capa-it.sel{background:#14223d;color:#fff}
.capa-it.hijo{padding-left:28px;color:#c3cad4}
.capa-it svg{width:12px;height:12px;flex:none;color:var(--tenue)}
.capa-it .t{margin-left:auto;font:10px/1 var(--f-mono);color:var(--flecha);letter-spacing:.06em;text-transform:uppercase}
#herr{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);border-radius:10px;padding:5px;display:flex;gap:2px;align-items:center}
.h{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:6px;cursor:pointer;color:#c9d0da}
.h:hover{background:#18202b}
.h.on{background:var(--sel);color:#fff}
.h svg{width:16px;height:16px}
.sep{width:1px;height:20px;background:var(--borde-2);margin:0 4px}
#mapa{right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:200px;height:130px;border-radius:8px;overflow:hidden;cursor:pointer}
#mapa svg{width:100%;height:100%;display:block}
#insp{top:calc(60px + env(safe-area-inset-top,0px));right:12px;width:360px;max-height:calc(100% - 220px);overflow:auto;border-radius:8px}
.insp-cab{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--borde);font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);position:sticky;top:0;background:rgba(10,12,16,.96)}
.insp-c{padding:14px;display:grid;gap:12px}
.insp-c h3{margin:0;font:600 17px/1.3 var(--f-ui)}
.insp-c p{margin:0;color:#b9c1cc}
.porque{border-left:2px solid var(--flecha);padding-left:10px;color:#cfd5de;font-size:13px}
.mets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.met{background:var(--marco-2);border:1px solid var(--borde);border-radius:6px;padding:9px 10px}
.met b{display:block;font:700 19px/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.met span{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tenue)}
.met.eng{border-color:color-mix(in srgb,var(--flecha) 55%,var(--borde))}
.nota{font:11.5px/1.4 var(--f-mono);color:var(--tenue)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:11.5px/1 var(--f-mono);color:var(--tenue);border:1px solid var(--borde-2);padding:4px 7px;border-radius:4px}
.acciones{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;padding:9px 14px;border-radius:6px;font-size:13px;z-index:30}
.ayuda{position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font:11.5px/1.5 var(--f-mono);color:#5d6774;z-index:5;pointer-events:none}

@media (max-width:900px){#capas{display:none}.ayuda{display:none}.centro .txt{display:none}}
@media (max-width:640px){
  #mapa{display:none}.ruta{display:none}.avatares{display:none}
  #insp{left:12px;right:12px;width:auto;top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-height:55%}
}
@media (prefers-reduced-motion: reduce){.vivo::before,.glow,.barrido,.cursor-b{animation:none}}
</style>

<div id="vista" aria-label="Lienzo de salas. Arrastra para moverte y usa la rueda o pellizca para hacer zoom.">
  <div id="mundo"></div>
</div>

<header id="barra" class="capa">
  <div class="logo">
    <svg width="26" height="26" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="8" fill="#3d7bff"/><g fill="none" stroke="#f5c518" stroke-width="2.4" stroke-linecap="round"><path d="M20 31 L8 15"/><path d="M20 31 L12.5 11.5"/><path d="M20 31 L20 9.5"/><path d="M20 31 L27.5 11.5"/><path d="M20 31 L32 15"/></g></svg>
    <span>Salas del Camino</span>
  </div>
  <div class="ruta" id="ruta">/ <b>Edificio</b></div>
  <div class="centro"><span class="vivo off" id="vivo">Conectando</span><span class="txt" id="barrida"></span></div>
  <div class="avatares" id="avatares" title="Especialistas conectados"></div>
  <span id="zoomtxt">100%</span>
</header>

<nav id="capas" class="capa" aria-label="Capas"><h4>Capas</h4><div id="listaCapas"></div></nav>

<div id="herr" class="capa" role="toolbar" aria-label="Herramientas del lienzo">
  <button class="h on" id="hMover" title="Mover (H)" aria-label="Mover"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg></button>
  <span class="sep"></span>
  <button class="h" id="hMenos" title="Alejar (−)" aria-label="Alejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
  <button class="h" id="hMas" title="Acercar (+)" aria-label="Acercar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="h" id="hAjustar" title="Ver todo (1)" aria-label="Ver todo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/></svg></button>
  <button class="h" id="hRadar" title="Ir al Radar (R)" aria-label="Ir al Radar Viral"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 12l6-6"/></svg></button>
</div>
<div id="mapa" class="capa" aria-label="Minimapa"></div>
<aside id="insp" class="capa" hidden aria-label="Inspector"></aside>
<div class="ayuda">Arrastra para moverte · Rueda o pellizco para zoom · Doble clic para acercar</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Datos fijos ---------- */
const PLAT={instagram:{n:"Instagram",c:"#e1306c"},tiktok:{n:"TikTok",c:"#25f4ee"},youtube:{n:"YouTube",c:"#ff3b30"},facebook:{n:"Facebook",c:"#3b82f6"},
  x:{n:"X",c:"#a0a8b4"},reddit:{n:"Reddit",c:"#ff6a2b"},blog:{n:"Blog",c:"#3ddc97"},prensa:{n:"Prensa",c:"#a78bfa"},foro:{n:"Foro",c:"#f5c518"}};
const EQUIPO=[
  {id:"insta",n:"Lucía",rol:"Instagram y TikTok",c:"#e1306c"},
  {id:"yt",n:"Mateo",rol:"YouTube",c:"#ff3b30"},
  {id:"fb",n:"Carmen",rol:"Facebook y grupos",c:"#3b82f6"},
  {id:"prensa",n:"Andrés",rol:"Prensa",c:"#a78bfa"},
  {id:"blogs",n:"Inés",rol:"Blogs, Reddit y foros",c:"#3ddc97"},
  {id:"jefa",n:"Marta",rol:"Jefa de sala: buzz y duplicados",c:"#f5c518"},
];
const MARCOS=[
  {id:"radar",grupo:"radar",nombre:"Radar Viral / Sala",x:0,y:0,w:1200},
  {id:"metricas",grupo:"radar",nombre:"Radar Viral / Métricas",x:0,y:760,w:1200},
  {id:"listado",grupo:"radar",nombre:"Radar Viral / Listado en vivo",x:1300,y:0,w:860},
  {id:"bitacora",grupo:"radar",nombre:"Radar Viral / Equipo y bitácora",x:2260,y:0,w:560},
  {id:"redaccion",grupo:"obras",nombre:"Redacción",x:-1500,y:0,w:1200,obra:"Convertirá las tendencias del Radar en publicaciones listas para tus redes."},
  {id:"analisis",grupo:"obras",nombre:"Análisis",x:-1500,y:800,w:1200,obra:"Medirá el rendimiento de tus propias redes y lo comparará con lo viral."},
];

const st={items:[],estado:null,plat:"todas",periodo:"30",orden:"buzz",q:"",vista:"todo",limite:25,sel:null,marcoSel:null,conectado:false,db:null,dl:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";
function hace(iso){
  if(!iso)return"";const t=Date.parse(iso);if(isNaN(t))return"";
  const m=Math.round((Date.now()-t)/60000);

}

const limZ=z=>Math.min(4,Math.max(.06,z));

function caja(m){const el=document.getElementById("m-"+m.id);return{x:m.x,y:m.y,w:m.w,h:el?el.offsetHeight:600}}
function cajaTotal(ids){const bs=(ids?MARCOS.filter(m=>ids.includes(m.id)):MARCOS).map(caja);
  const x0=Math.min(...bs.map(b=>b.x)),y0=Math.min(...bs.map(b=>b.y))-(ids?0:200),x1=Math.max(...bs.map(b=>b.x+b.w)),y1=Math.max(...bs.map(b=>b.y+b.h));return{x:x0,y:y0,w:x1-x0,h:y1-y0}}
function volarA(b,pad=70,inst=false){
  const W=innerWidth,H=innerHeight,top=56,bot=70,left=innerWidth>900?260:12,right=$("#insp").hidden||innerWidth<640?12:380;
  const z=limZ(Math.min((W-left-right-pad*2)/b.w,(H-top-bot-pad*2)/b.h));
  const tx=left+(W-left-right)/2-(b.x+b.w/2)*z,ty=top+(H-top-bot)/2-(b.y+b.h/2)*z;
  cancelAnimationFrame(vuelo);
  if(inst||quieto){cam.x=tx;cam.y=ty;cam.z=z;aplicar();return}
  const a={...cam},t0=performance.now(),D=520;mundo.classList.add("moviendo");
  const paso=t=>{let k=Math.min(1,(t-t0)/D);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    const za=Math.exp(Math.log(a.z)+(Math.log(z)-Math.log(a.z))*k);cam.z=za;cam.x=a.x+(tx-a.x)*k;cam.y=a.y+(ty-a.y)*k;aplicar();
    if(k<1)vuelo=requestAnimationFrame(paso);else mundo.classList.remove("moviendo")};
  vuelo=requestAnimationFrame(paso);
}

const mundoA={gente:[],raf:0,ult:0,prox:0,cont:null,bocas:[]};
const corr=pt=>pt.y<=70?62:pt.y<=170?160:268;
function ruta(f,t){const c0=corr(f),c1=corr(t),r=[{x:f.x,y:c0}];
  if(c0!==c1){const mid=(f.x+t.x)/2;const ax=PASILLOS.reduce((b,v)=>Math.abs(v-mid)<Math.abs(b-mid)?v:b);r.push({x:ax,y:c0},{x:ax,y:c1})}
  r.push({x:t.x,y:c1},{x:t.x,y:t.y});return r}
function fraseReal(p){
  if(p.a.id==="jefa"){const top=activos().sort((a,b)=>(b.buzz||0)-(a.buzz||0))[0];return top?`Lo más fuerte ahora: «${corta(top.titulo,70)}»`:azar(FRASES.jefa)}
  const mio=activos().filter(i=>i.agente===p.a.n).sort((a,b)=>Date.parse(b.detectado)-Date.parse(a.detectado));
  if(mio.length){const i=azar(mio.slice(0,4));const t=interacciones(i);return`Mirad esto${t?` (${fmt(t)} interacciones)`:""}: «${corta(i.titulo,64)}»`}
  return azar(FRASES[p.a.id]);
}

function iniciarMundo(){
  mundoA.cont=$("#plano-radar");
  mundoA.gente=EQUIPO.map((a,i)=>{const[x,y]=PUESTOS[a.id];const seat={x,y:y+34};const el=document.getElementById("p-"+a.id);
    return{a,i,seat,x:seat.x,y:seat.y,r:[],estado:"sentado",hasta:0,el}});
  mundoA.prox=performance.now()+1000;mundoA.ult=performance.now();
  const tick=ts=>{const dt=Math.min(.05,(ts-mundoA.ult)/1000);mundoA.ult=ts;
    if(ts>mundoA.prox){mundoA.prox=ts+2800+Math.random()*3800;planificar(ts)}
    for(const p of mundoA.gente){
      if(p.r.length){const t=p.r[0],dx=t.x-p.x,dy=t.y-p.y,dist=Math.hypot(dx,dy),v=80*dt;
        if(dist<=v||quieto){p.x=t.x;p.y=t.y;p.r.shift()}else{p.x+=dx/dist*v;p.y+=dy/dist*v}
        if(!p.r.length){if(p.estado==="ida"){p.estado="visita";p.hasta=ts+4200+Math.random()*2400;bocadillo(p,p.frase,p.hasta-ts)}
          else if(p.estado==="vuelta")p.estado="sentado"}}
      else if(p.estado==="visita"&&ts>p.hasta){p.estado="vuelta";p.r=ruta(p,p.seat)}
      const bob=p.estado==="sentado"&&!quieto?Math.sin(ts/260+p.i*1.7)*.8:0;
      p.el.setAttribute("transform",`translate(${p.x.toFixed(1)} ${(p.y+bob).toFixed(1)})`);
    }
    mundoA.raf=requestAnimationFrame(tick)};
  mundoA.raf=requestAnimationFrame(tick);
}
function planificar(){
  const libres=mundoA.gente.filter(p=>p.estado==="sentado");if(!libres.length)return;
  const p=azar(libres),r=Math.random();
  if(r<.38){p.estado="ida";p.frase=fraseReal(p);p.r=ruta(p,{x:250+Math.random()*100,y:66})}
  else if(r<.62){const q=azar(mundoA.gente.filter(x=>x!==p));p.estado="ida";const lado=q.seat.x>500?-27:27;
    p.frase=q.a.id==="jefa"?`Marta, ¿cuánto buzz le damos a esto?`:p.a.id==="jefa"?`${q.a.n}, ¿esto está verificado?`:`${q.a.n}, ¿has visto lo que está pasando con esto?`;
    p.r=ruta(p,{x:q.seat.x+lado,y:q.seat.y})}
  else if(r<.74){p.estado="ida";p.frase=azar(["Pausa de café","Cinco minutos y sigo","¿Alguien quiere café?"]);p.r=ruta(p,{x:70,y:262})}
  else bocadillo(p,fraseMesa(p),4600);
}

/* ---------- Contenido de datos ---------- */
function filtrados(){
  const lim=st.periodo==="todo"?Infinity:+st.periodo*864e5;const q=st.q.trim().toLowerCase();
  const r=st.items.filter(i=>{
    if(st.vista==="guardados"&&!i.guardado)return false;
    if(st.vista==="descartados"?!i.descartado:i.descartado)return false;
    if(st.plat!=="todas"&&i.plataforma!==st.plat)return false;
    const f=Date.parse(i.publicado||i.detectado);if(!isNaN(f)&&Date.now()-f>lim)return false;
    if(q&&!`${i.titulo} ${i.resumen} ${i.fuente} ${(i.etiquetas||[]).join(" ")}`.toLowerCase().includes(q))return false;
    return true});
  return r.sort(st.orden==="buzz"?(a,b)=>(b.buzz||0)-(a.buzz||0):st.orden==="interacciones"?porGanador:(a,b)=>Date.parse(b.detectado||0)-Date.parse(a.detectado||0));
}
function pintarDatos(){
  const items=activos(),e=st.estado||{};
  const dia=items.filter(i=>Date.now()-Date.parse(i.detectado)<864e5).length;
  const top=items.slice().sort((a,b)=>(b.buzz||0)-(a.buzz||0))[0];
  const gan=items.filter(i=>interacciones(i)>0||vistas(i)>0).sort(porGanador);
  // cabeceras
  const set=(id,v)=>{const el=document.getElementById(id);if(el)el.textContent=v};
  set("salaN",`${items.length} en el radar`);set("pantN",`${items.length} en el radar`);set("salaUlt",e.ultimaBarrida?`Última barrida ${hace(e.ultimaBarrida)}`:"");
  for(const id of["vivo","vivoSala"]){const v=document.getElementById(id);if(v){v.classList.toggle("off",!st.conectado);v.textContent=st.conectado?"En directo":"Conectando"}}
  set("barrida",e.ultimaBarrida?`Última barrida ${hace(e.ultimaBarrida)} · próxima ${enCuanto(e.proximaBarrida)}`:"");
  // métricas
  $("#c-metricas").innerHTML=`<div class="mcab"><h2>Métricas y posts ganadores</h2><div class="meta">Interacciones = me gusta + reacciones + comentarios + compartidos + guardados</div></div>
    <div class="kpis">
      <div class="kpi"><b>${items.length}</b><span>En el radar</span></div>
      <div class="kpi"><b>${dia}</b><span>Últimas 24 h</span></div>
      <div class="kpi"><b>${top?top.buzz:"–"}</b><span>Buzz máximo</span></div>
      <div class="kpi"><b>${gan[0]&&interacciones(gan[0])?fmt(interacciones(gan[0])):"–"}</b><span>Interacciones del top 1</span></div>
      <div class="kpi"><b>${esc(enCuanto(e.proximaBarrida))}</b><span>Próxima barrida</span></div>
    </div>
    <div class="seccion-t">Podio por interacciones</div>
    ${gan.length?`<div class="podio">${gan.slice(0,3).map((i,k)=>{const p=PLAT[i.plataforma]||{n:i.plataforma,c:"#7f8a99"};const t=interacciones(i),m=i.metricas||{};
      return`<div class="ganador" data-id="${esc(i.id)}"><div class="pos"><span>#${k+1}</span><span class="plat" style="--c:${p.c}">${esc(p.n)}</span></div>
        <div class="total">${t>0?fmt(t):fmt(vistas(i))}<small>${t>0?"interacciones":"visualizaciones"}${m.aprox?" · aprox.":""}</small></div>
        <div class="tit">${esc(corta(i.titulo,90))}</div><div class="desg">${esc(MET.filter(([key])=>fmt(m[key])).map(([key,l])=>`${fmt(m[key])} ${l.toLowerCase()}`).join(" · "))}</div></div>`}).join("")}</div>`
      :`<div class="vacio"><b>Aún no hay interacciones medidas</b>En cada barrida el equipo apunta visualizaciones, me gusta, comentarios y compartidos de los posts ganadores.</div>`}`;
  // listado
  pintarListado();
  // equipo y bitácora
  const ag=e.agentes||{};
  $("#c-bitacora").innerHTML=`<div class="mcab"><h2>Equipo y bitácora</h2><div class="meta">${EQUIPO.length} especialistas</div></div>
    <div class="equipo">${EQUIPO.map(a=>{const x=ag[a.id]||{};return`<div class="agente"><span class="av" style="--c:${a.c}">${esc(a.n.slice(0,2).toUpperCase())}</span><div><div class="n">${esc(a.n)}</div><div class="r">${esc(a.rol)}</div></div><div class="a">${x.ultima?`${esc(hace(x.ultima))}<br>${x.hallazgos??0} nuevos`:"sin datos"}</div></div>`}).join("")}</div>
    <ol class="bit">${(e.bitacora||[]).slice(0,24).map(b=>{const a=EQUIPO.find(x=>x.n===b.quien);return`<li style="--c:${a?a.c:"#7f8a99"}"><div><time>${esc(hace(b.t))} · ${esc(b.quien||"")}</time>${esc(b.texto)}</div></li>`}).join("")||'<li><div>Aquí verás qué hace cada especialista en cada barrida.</div></li>'}</ol>`;
  if(st.sel)pintarInsp();
  pintarMapa();
}
function pintarListado(){
  const items=activos();const porPlat={};items.forEach(i=>porPlat[i.plataforma]=(porPlat[i.plataforma]||0)+1);
  const lista=filtrados();const foco=document.activeElement?.id,selS=document.activeElement?.selectionStart;
  $("#c-listado").innerHTML=`<div class="mcab"><h2>Listado en vivo</h2><div class="meta">${lista.length} resultados</div></div>
  <div class="filtros">
    <button class="chip" data-plat="todas" aria-pressed="${st.plat==="todas"}">Todas <i>${items.length}</i></button>
    ${Object.keys(PLAT).filter(p=>porPlat[p]).map(p=>`<button class="chip" data-plat="${p}" aria-pressed="${st.plat===p}">${PLAT[p].n} <i>${porPlat[p]}</i></button>`).join("")}
  </div>
  <div class="filtros">
    <input class="campo buscar" id="q" type="search" placeholder="Buscar: Muxía, albergue, Primitivo…" value="${esc(st.q)}" aria-label="Buscar">
    <select class="campo" id="periodo" aria-label="Periodo"><option value="1">24 horas</option><option value="7">7 días</option><option value="30">30 días</option><option value="todo">Todo</option></select>
    <select class="campo" id="orden" aria-label="Orden"><option value="buzz">Más buzz</option><option value="interacciones">Más interacciones</option><option value="recientes">Más recientes</option></select>
    <select class="campo" id="vista" aria-label="Vista"><option value="todo">Todo</option><option value="guardados">Guardados</option><option value="descartados">Descartados</option></select>
    <button class="btn prim" id="exportar">Exportar CSV</button>
  </div>
  <ul class="lista">${lista.length?lista.slice(0,st.limite).map(fila).join(""):`<li class="vacio"><b>${st.items.length?"Nada con estos filtros":st.conectado?"El equipo está en su primera barrida":"Conectando con la sala"}</b>${st.items.length?"Prueba con otro periodo o plataforma.":"Los hallazgos aparecerán aquí ordenados por buzz."}</li>`}</ul>
  ${lista.length>st.limite?`<button class="btn mas" id="verMas">Mostrar ${Math.min(25,lista.length-st.limite)} más de ${lista.length-st.limite}</button>`:""}`;
  $("#periodo").value=st.periodo;$("#orden").value=st.orden;$("#vista").value=st.vista;
  if(foco==="q"){const q=$("#q");q.focus();try{q.setSelectionRange(selS,selS)}catch(_){}}
}
function fila(i){
  const p=PLAT[i.plataforma]||{n:i.plataforma||"Web",c:"#7f8a99"};const nuevo=Date.now()-Date.parse(i.detectado)<6*36e5;const t=interacciones(i);
  return`<li class="item${st.sel===i.id?" sel":""}" data-id="${esc(i.id)}">
    <div class="buzz"><b>${i.buzz??"–"}</b><span><i style="width:${Math.max(4,Math.min(100,i.buzz||0))}%;background:${colorBuzz(i.buzz||0)}"></i></span><small>buzz</small></div>
    <div style="min-width:0"><div class="imeta"><span class="plat" style="--c:${p.c}">${esc(p.n)}</span>${nuevo?'<span class="nuevo">Nuevo</span>':""}${i.guardado?'<span class="nuevo" style="background:var(--sel);color:#fff">Guardado</span>':""}<span>${esc(corta(i.fuente,40))}</span><span>${esc(hace(i.publicado)||"")}</span></div>
      <h3>${esc(i.titulo)}</h3><p>${esc(corta(i.resumen,170))}</p>
      ${t||vistas(i)?`<div class="mini-met">${vistas(i)?`<span><b>${fmt(vistas(i))}</b> vistas</span>`:""}${t?`<span><b>${fmt(t)}</b> interacciones</span>`:""}${engagement(i)!=null?`<span><b>${engagement(i).toLocaleString("es-ES",{maximumFractionDigits:1})} %</b> engagement</span>`:""}</div>`:""}
    </div></li>`;
}

/* Inspector */
function pintarInsp(){
  const i=st.items.find(x=>x.id===st.sel);const el=$("#insp");if(!i){cerrarInsp();return}
  const p=PLAT[i.plataforma]||{n:i.plataforma,c:"#7f8a99"},m=i.metricas||{},e=engagement(i);
  const cel=MET.filter(([k])=>fmt(m[k])).map(([k,l])=>`<div class="met"><b>${fmt(m[k])}</b><span>${l}</span></div>`);
  if(e!=null)cel.push(`<div class="met eng"><b>${e.toLocaleString("es-ES",{maximumFractionDigits:1})} %</b><span>Engagement</span></div>`);
  el.innerHTML=`<div class="insp-cab"><span>Contenido</span><button class="h" id="cerrarInsp" aria-label="Cerrar" style="width:26px;height:26px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="insp-c">
    <div class="imeta"><span class="plat" style="--c:${p.c}">${esc(p.n)}</span><span>Buzz ${i.buzz??"–"}</span><span>por ${esc(i.agente||"el equipo")}</span></div>
    <h3>${esc(i.titulo)}</h3>
    <div class="nota">${esc(i.fuente||"")}${i.publicado?` · publicado ${esc(hace(i.publicado))}`:""} · detectado ${esc(hace(i.detectado))}</div>
    <p>${esc(i.resumen)}</p>
    ${i.porque?`<div class="porque">${esc(i.porque)}</div>`:""}
    ${cel.length?`<div class="mets">${cel.join("")}</div><div class="nota">Métricas${m.aprox?" aproximadas":""}${m.fuente?": "+esc(m.fuente):""}${m.medido?" · medidas "+esc(hace(m.medido)):""}</div>`:`<div class="nota">Sin métricas de interacción todavía.</div>`}
    ${i.senales?`<div class="nota">${esc(i.senales)}</div>`:""}
    ${(i.etiquetas||[]).length?`<div class="tags">${i.etiquetas.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")}</div>`:""}
    <div class="acciones">
      <a class="btn prim" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener" style="text-decoration:none">Abrir original</a>
      <button class="btn" data-acc="guardar" aria-pressed="${!!i.guardado}">${i.guardado?"Guardado":"Guardar"}</button>
      <button class="btn" data-acc="copiar">Copiar ficha</button>
      <button class="btn" data-acc="descartar" aria-pressed="${!!i.descartado}">${i.descartado?"Recuperar":"Descartar"}</button>
    </div>
  </div>`;
  el.hidden=false;
}
function cerrarInsp(){st.sel=null;$("#insp").hidden=true;document.querySelectorAll(".item.sel").forEach(x=>x.classList.remove("sel"))}

document.addEventListener("click",async e=>{
  if(e.target.closest("#cerrarInsp")){cerrarInsp();return}
  const c=e.target.closest("[data-plat]");if(c){st.plat=c.dataset.plat;st.limite=25;pintarListado();return}
  if(e.target.id==="verMas"){st.limite+=25;pintarListado();return}
  if(e.target.id==="exportar"){exportar();return}
  const it=e.target.closest(".item[data-id],.ganador[data-id]");
  if(it&&!e.target.closest("a,button")){st.sel=it.dataset.id;document.querySelectorAll(".item").forEach(x=>x.classList.toggle("sel",x.dataset.id===st.sel));pintarInsp();return}
  const a=e.target.closest("[data-acc]");if(!a)return;
  const i=st.items.find(x=>x.id===st.sel);if(!i)return;
  if(a.dataset.acc==="copiar"){
    const m=i.metricas||{};
    const t=`${i.titulo}\n${i.url}\n${PLAT[i.plataforma]?.n||i.plataforma} · ${i.fuente} · buzz ${i.buzz}\n${i.resumen}${i.porque?"\nPor qué funciona: "+i.porque:""}${MET.filter(([k])=>fmt(m[k])).map(([k,l])=>`\n${l}: ${fmt(m[k])}`).join("")}`;
    try{await navigator.clipboard.writeText(t);toast("Ficha copiada")}catch(_){toast("No se pudo copiar en este visor")}return}
  if(!st.db){toast("Sin conexión con la sala");return}
  const campo=a.dataset.acc==="guardar"?"guardado":"descartado";
  try{await st.db.doc("radar/"+i.id).update({[campo]:!i[campo]});toast(campo==="guardado"?(i[campo]?"Quitado de guardados":"Guardado"):(i[campo]?"Recuperado":"Descartado"))}
  catch(_){toast("Solo el propietario puede marcar contenidos")}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;st.limite=25;clearTimeout(pintarListado.t);pintarListado.t=setTimeout(pintarListado,180)}});
document.addEventListener("change",e=>{if(["periodo","orden","vista"].includes(e.target.id)){st[e.target.id]=e.target.value;st.limite=25;pintarListado()}});

async function exportar(){
  const rows=filtrados();const cols=["buzz","plataforma","titulo","url","fuente","publicado","detectado","vistas","likes","reacciones","comentarios","compartidos","guardados","seguidores","interacciones","resumen","porque","senales","etiquetas","agente"];
  const q=v=>`"${String(Array.isArray(v)?v.join(" "):v??"").replace(/"/g,'""')}"`;
  const csv="﻿"+[cols.join(";"),...rows.map(r=>cols.map(c=>q(c==="interacciones"?(interacciones(r)||""):MET.some(([k])=>k===c)?(r.metricas||{})[c]:r[c])).join(";"))].join("\n");
  if(!st.dl){toast("La descarga no está disponible en este visor");return}
  try{await st.dl.save({filename:`radar-viral-camino-${new Date().toISOString().slice(0,10)}.csv`,data:csv})}catch(err){if(err?.code!=="declined")toast("No se pudo exportar")}
}

/* ---------- Arranque ---------- */
construir();pintarDatos();iniciarMundo();
const inicioRadar=location.hash==="#radar";
requestAnimationFrame(()=>{if(inicioRadar)irAMarco("radar");else volarA(cajaTotal(),70,true)});
setInterval(()=>{if(document.activeElement?.id!=="q")pintarDatos()},60000);

(async()=>{
  const db=await window.claude?.use?.("db");
  st.dl=await window.claude?.use?.("downloads");
  if(!db){$("#barrida").textContent="Abre esta página desde claude.ai para verla en vivo.";return}
  st.db=db;
  db.collection("radar").orderBy("detectado","desc").limit(600).onSnapshot(s=>{
    st.conectado=true;st.items=s.docs.map(d=>({id:d.id,...d.data()}));
    if(document.activeElement?.id!=="q")pintarDatos();
  },()=>{st.conectado=false;pintarDatos()});
  db.doc("estado/radar").onSnapshot(s=>{st.estado=s.exists?s.data():null;if(document.activeElement?.id!=="q")pintarDatos()});
})();
</script>
