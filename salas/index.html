<title>Salas del Camino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: lienzo infinito sobre el vacío. Las salas son marcos flotantes (estilo editor de diseño) que se recorren arrastrando y con zoom.
   Capas fijas encima: barra superior, panel de capas, inspector, barra de herramientas y minimapa. Diseño deliberadamente oscuro en ambos temas. */
:root{
  --vacio:#030405;        /* el fondo infinito */
  --punto:#1a1f27;        /* retícula de puntos */
  --marco:#0b0e13;        /* superficie de marcos */
  --marco-2:#11151c;      /* superficies elevadas dentro del marco */
  --borde:#1d232d;
  --borde-2:#2a3240;
  --texto:#e7ebf1;
  --tenue:#7f8a99;
  --sel:#3d7bff;          /* azul de selección */
  --flecha:#f5c518;       /* amarillo de la flecha del Camino */
  --vivo:#3ddc97; --caliente:#ff5d5d; --tibio:#ffab3d;
  --f-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--vacio);color:var(--texto);font:14px/1.45 var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* Vista y mundo */
#vista{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-color:var(--vacio);background-image:radial-gradient(var(--punto) 1.1px,transparent 1.2px)}
#vista.arrastrando{cursor:grabbing}
#mundo{position:absolute;left:0;top:0;transform-origin:0 0}
#mundo.moviendo{will-change:transform}

/* Marcos */
.marco{position:absolute;background:var(--marco);border:1px solid var(--borde);border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.marco:hover{border-color:var(--borde-2)}
.marco.sel{outline:calc(2px * var(--iz,1)) solid var(--sel);outline-offset:0}
.etiqueta{position:absolute;left:0;bottom:100%;transform-origin:0 100%;transform:scale(var(--iz,1));padding-bottom:6px;white-space:nowrap;
  font:500 12px/1 var(--f-ui);color:var(--tenue);cursor:pointer;display:flex;gap:6px;align-items:center}
.marco.sel .etiqueta,.etiqueta:hover{color:var(--sel)}
.etiqueta svg{width:11px;height:11px}
.grupo-titulo{position:absolute;font:800 72px/1 var(--f-ui);letter-spacing:-.03em;color:var(--texto);white-space:nowrap;pointer-events:none}
.grupo-titulo small{display:block;font:500 18px/1.4 var(--f-mono);letter-spacing:.04em;color:var(--tenue);margin-top:12px;text-transform:uppercase}
.grupo-titulo .ok{color:var(--vivo)}
.marco.dato{display:none}
body[data-dentro="radar"] .marco.dato[data-sala="radar"],body[data-dentro="competencia"] .marco.dato[data-sala="competencia"]{display:block;animation:entra .45s ease-out both}
@keyframes entra{from{opacity:0}}
#m-radar,#m-competencia{cursor:pointer}
body[data-dentro="radar"] #m-radar,body[data-dentro="competencia"] #m-competencia{cursor:inherit}
.entrar-pista{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--sel);padding:6px 9px;border-radius:4px;box-shadow:0 0 18px rgba(61,123,255,.5)}
body[data-dentro="radar"] #m-radar .entrar-pista,body[data-dentro="competencia"] #m-competencia .entrar-pista{display:none}
.salir{display:none}
body[data-dentro="radar"] #m-radar .salir,body[data-dentro="competencia"] #m-competencia .salir{display:inline-flex}
#m-competencia:hover{box-shadow:0 0 0 1px rgba(255,107,61,.45),0 0 60px rgba(255,107,61,.16),0 30px 80px rgba(0,0,0,.6)}
#m-radar:hover{box-shadow:0 0 0 1px rgba(61,123,255,.45),0 0 60px rgba(61,123,255,.18),0 30px 80px rgba(0,0,0,.6)}
.pasillos{position:absolute;pointer-events:none;overflow:visible}
.flujo{animation:flujo 1.1s linear infinite}
@keyframes flujo{to{stroke-dashoffset:-40}}
.p-txt{font:500 26px var(--f-mono);fill:#8792a2;letter-spacing:.04em}
.p-sub{font:500 18px var(--f-mono);fill:#4f5967;letter-spacing:.04em}
@media (prefers-reduced-motion: reduce){.flujo{animation:none}}

/* Cabecera interna de marco */
.mcab{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--borde)}
.mcab h2{margin:0;font:700 20px/1.1 var(--f-ui);letter-spacing:-.01em}
.mcab .meta{font:500 12px/1.3 var(--f-mono);color:var(--tenue);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.vivo{display:inline-flex;align-items:center;gap:6px;color:var(--vivo);font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.vivo::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;animation:latido 2s ease-in-out infinite}
.vivo.off{color:var(--tenue)}.vivo.off::before{animation:none;box-shadow:none}
@keyframes latido{50%{opacity:.3}}
.obra-tag{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--flecha);border:1px solid color-mix(in srgb,var(--flecha) 45%,transparent);padding:5px 8px;border-radius:3px}

/* Plano */
.plano{position:relative;width:1200px;height:600px;overflow:hidden}
.plano svg{position:absolute;inset:0;width:100%;height:100%}
.nombre{font:600 11px var(--f-ui);fill:#fff}
.pant-t{font:600 11px var(--f-mono);fill:#7fffc4;letter-spacing:.14em}
.pant-n{font:600 13px var(--f-mono);fill:var(--flecha)}
.cartel{font:600 26px var(--f-mono);fill:var(--flecha);letter-spacing:.18em}
.cartel-sub{font:500 12px var(--f-mono);fill:var(--tenue);letter-spacing:.06em}
.glow{animation:tecleo 1.4s steps(3) infinite}
@keyframes tecleo{50%{opacity:.45}}
.barrido{transform-origin:0 0;animation:gira 3s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.cursor-b{animation:parpadeo 1s steps(1) infinite}
@keyframes parpadeo{50%{opacity:0}}
.bocadillo{position:absolute;transform:translate(-50%,calc(-100% - 22px));background:#0f141b;color:var(--texto);border:1px solid var(--borde-2);
  padding:8px 11px;border-radius:8px;font-size:13px;line-height:1.35;width:max-content;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.6);pointer-events:none;z-index:2}
.bocadillo b{display:block;font:600 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.bocadillo.abajo{transform:translate(-50%,26px)}

/* Métricas y podio */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--borde)}
.kpi{padding:18px 20px;border-right:1px solid var(--borde)}
.kpi:last-child{border-right:0}
.kpi b{display:block;font:700 34px/1 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{display:block;margin-top:8px;font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.podio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 20px 20px}
.ganador{background:var(--marco-2);border:1px solid var(--borde);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0}
.ganador:hover{border-color:var(--sel)}
.ganador .pos{display:flex;justify-content:space-between;align-items:center;font:600 12px/1 var(--f-mono);color:var(--tenue)}
.ganador .total{font:800 40px/1 var(--f-ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ganador .total small{display:block;font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tenue);margin-top:6px}
.ganador .tit{font-weight:600;line-height:1.3}
.ganador .desg{font:12px/1.5 var(--f-mono);color:var(--tenue)}
.seccion-t{padding:16px 20px 0;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}

/* Listado */
.filtros{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px;border-bottom:1px solid var(--borde);align-items:center}
.chip{border:1px solid var(--borde-2);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:#fff}
.chip i{font:normal 11px/1 var(--f-mono);opacity:.7}
.campo{background:var(--marco-2);border:1px solid var(--borde-2);border-radius:6px;padding:6px 10px;font-size:13px}
.buscar{flex:1 1 180px;min-width:0}
.btn{background:var(--marco-2);border:1px solid var(--borde-2);border-radius:6px;padding:6px 11px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--sel)}
.btn.prim{background:var(--sel);border-color:var(--sel);color:#fff}
.btn[aria-pressed="true"]{background:#1b2a4a;border-color:var(--sel)}
.lista{list-style:none;margin:0;padding:8px 12px 14px}
.item{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;padding:14px 10px;border-bottom:1px solid var(--borde);cursor:pointer;border-radius:6px}
.item:hover{background:var(--marco-2)}
.item.sel{background:#101a2e;box-shadow:inset 0 0 0 1px var(--sel)}
.buzz{text-align:center}
.buzz b{display:block;font:800 26px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.buzz span{display:block;margin-top:5px;height:3px;border-radius:2px;background:var(--borde-2);overflow:hidden}
.buzz span i{display:block;height:100%}
.buzz small{display:block;margin-top:5px;font:500 9.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.imeta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font:12px/1.3 var(--f-mono);color:var(--tenue)}
.plat{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--texto)}
.plat::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.nuevo{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#000;background:var(--flecha);padding:3px 6px;border-radius:3px}
.item h3{margin:6px 0 4px;font:600 16px/1.3 var(--f-ui);text-wrap:balance}
.item p{margin:0;color:#b9c1cc;font-size:13.5px}
.mini-met{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font:12px/1.2 var(--f-mono);color:var(--tenue)}
.mini-met b{color:var(--texto);font-weight:600}
.mas{display:block;width:calc(100% - 24px);margin:4px 12px 16px}
.vacio{padding:28px 20px;color:var(--tenue)}
.vacio b{display:block;color:var(--texto);font:600 16px/1.3 var(--f-ui);margin-bottom:6px}

/* Bitácora y equipo */
.equipo{display:grid;gap:2px;padding:10px 12px;border-bottom:1px solid var(--borde)}
.agente{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:6px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--f-mono);color:#fff;box-shadow:0 0 12px var(--c);background:var(--c)}
.agente .n{font-weight:600;font-size:13.5px}
.agente .r{font-size:12px;color:var(--tenue);line-height:1.3}
.agente .a{font:11.5px/1.3 var(--f-mono);color:var(--tenue);text-align:right}
.bit{list-style:none;margin:0;padding:12px 20px 18px;display:grid;gap:14px}
.bit li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;font-size:13px;line-height:1.4}
.bit li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--tenue));margin-top:6px}
.bit time{display:block;font:11.5px/1.3 var(--f-mono);color:var(--tenue);margin-bottom:2px}

/* Metricool en vivo */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--borde-2);background:transparent;border-radius:6px;padding:7px 12px;cursor:pointer;font:600 13px/1 var(--f-mono);display:inline-flex;gap:8px;align-items:center}
.tab[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:#fff}
.tab small{font:500 10px/1 var(--f-mono);opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.tab.off{opacity:.55}
.mc-sec{padding:18px 20px;border-bottom:1px solid var(--borde)}
.mc-sec:last-child{border-bottom:0}
.mc-sec h3{margin:0 0 12px;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);display:flex;justify-content:space-between;gap:10px}
.mc-sec h3 span{text-transform:none;letter-spacing:0;font-weight:500}
.mc-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 2fr;gap:12px;align-items:stretch}
.mc-kpi{background:var(--marco-2);border:1px solid var(--borde);border-radius:6px;padding:12px 14px}
.mc-kpi b{display:block;font:700 26px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.mc-kpi span{display:block;margin-top:6px;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.spark{background:var(--marco-2);border:1px solid var(--borde);border-radius:6px;padding:10px 12px;min-width:0}
.spark svg{width:100%;height:70px;display:block}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);text-align:right;padding:6px 8px;border-bottom:1px solid var(--borde)}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla td{padding:9px 8px;border-bottom:1px solid #141922;text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
.tabla td:first-child{max-width:520px}
.tabla a{text-decoration:none;font-weight:500}
.tabla a:hover{text-decoration:underline;text-decoration-color:var(--sel)}
.tabla .sub{display:block;font:11.5px/1.3 var(--f-mono);color:var(--tenue);margin-top:2px;font-weight:400}
.tabla tr.top td{background:#0f1726}
.aviso{border:1px dashed var(--borde-2);border-radius:6px;padding:14px 16px;color:#c3cad4;font-size:13.5px;line-height:1.5}
.aviso b{color:var(--texto)}
.aviso.err{border-color:color-mix(in srgb,var(--caliente) 50%,var(--borde));border-style:solid}
.aviso ul{margin:8px 0 0;padding-left:18px}
.fuente-mc{font:11.5px/1.3 var(--f-mono);color:var(--tenue)}
.mk{font:600 10px/1 var(--f-mono);letter-spacing:.06em;padding:3px 5px;border-radius:3px;border:1px solid var(--borde-2);color:#c3cad4}

/* Competencia */
.alertas{list-style:none;margin:0;padding:6px 12px 14px}
.alerta{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px 10px;border-bottom:1px solid var(--borde)}
.alerta .cuando{font:12px/1.4 var(--f-mono);color:var(--tenue)}
.alerta .cuando b{display:block;color:var(--texto);font-weight:600}
.alerta h4{margin:4px 0;font:600 15.5px/1.3 var(--f-ui)}
.alerta p{margin:0;color:#b9c1cc;font-size:13.5px}
.tipo{display:inline-flex;align-items:center;gap:6px;font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--texto)}
.tipo::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.impacto{font:600 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:3px}
.impacto.alto{background:var(--caliente);color:#000}.impacto.medio{background:var(--tibio);color:#000}.impacto.bajo{background:var(--borde-2);color:#c3cad4}
.difs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.dif{font:12px/1.45 var(--f-mono);padding:8px 10px;border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:140px;overflow:auto}
.dif.antes{background:#1a0e10;border:1px solid #3a1a1f;color:#f3b7bd}
.dif.despues{background:#0d1a12;border:1px solid #1b3a26;color:#b6f0c9}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:14px 16px 18px}
.player{background:var(--marco-2);border:1px solid var(--borde);border-radius:6px;padding:14px;display:grid;gap:8px;cursor:pointer;min-width:0}
.player:hover,.player.sel{border-color:#ff6b3d}
.player h4{margin:0;font:700 16px/1.2 var(--f-ui);display:flex;justify-content:space-between;gap:8px;align-items:center}
.player .web{font:12px/1.3 var(--f-mono);color:var(--tenue);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .cnt{display:flex;gap:12px;flex-wrap:wrap;font:12px/1.2 var(--f-mono);color:var(--tenue)}
.player .cnt b{color:var(--texto)}
.player .ult{font-size:13px;color:#c3cad4;line-height:1.35}
.vig{font:600 10px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:3px;background:#12301f;color:var(--vivo)}
.vig.no{background:#2a2410;color:var(--flecha)}

/* Capas fijas */
.capa{position:fixed;z-index:10;background:rgba(10,12,16,.92);border:1px solid var(--borde);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#barra{top:0;left:0;right:0;height:calc(48px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;border-width:0 0 1px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap}
.logo svg{flex:none}
.ruta{color:var(--tenue);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ruta b{color:var(--texto);font-weight:500}
.centro{margin:0 auto;display:flex;gap:12px;align-items:center;font:12px/1 var(--f-mono);color:var(--tenue);white-space:nowrap}
.avatares{display:flex;padding-left:6px}
.avatares .av{width:26px;height:26px;margin-left:-6px;border:2px solid #0a0c10;font-size:10px;box-shadow:none}
#zoomtxt{font:500 12px/1 var(--f-mono);color:var(--tenue);min-width:44px;text-align:right}
#capas{top:calc(60px + env(safe-area-inset-top,0px));left:12px;width:236px;border-radius:8px;padding:10px 6px}
#capas h4{margin:4px 10px 8px;font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.capa-it{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-radius:5px;padding:7px 10px;cursor:pointer;text-align:left;font-size:13px}
.capa-it:hover{background:#151a22}
.capa-it.sel{background:#14223d;color:#fff}
.capa-it.hijo{padding-left:28px;color:#c3cad4}
.capa-it svg{width:12px;height:12px;flex:none;color:var(--tenue)}
.capa-it .t{margin-left:auto;font:10px/1 var(--f-mono);color:var(--flecha);letter-spacing:.06em;text-transform:uppercase}
#herr{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);border-radius:10px;padding:5px;display:flex;gap:2px;align-items:center}
.h{width:34px;height:34px;display:grid;place-items:center;background:none;border:0;border-radius:6px;cursor:pointer;color:#c9d0da}
.h:hover{background:#18202b}
.h.on{background:var(--sel);color:#fff}
.h svg{width:16px;height:16px}
.sep{width:1px;height:20px;background:var(--borde-2);margin:0 4px}
#mapa{right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:200px;height:130px;border-radius:8px;overflow:hidden;cursor:pointer}
#mapa svg{width:100%;height:100%;display:block}
#insp{top:calc(60px + env(safe-area-inset-top,0px));right:12px;width:360px;max-height:calc(100% - 220px);overflow:auto;border-radius:8px}
.insp-cab{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--borde);font:600 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tenue);position:sticky;top:0;background:rgba(10,12,16,.96)}
.insp-c{padding:14px;display:grid;gap:12px}
.insp-c h3{margin:0;font:600 17px/1.3 var(--f-ui)}
.insp-c p{margin:0;color:#b9c1cc}
.porque{border-left:2px solid var(--flecha);padding-left:10px;color:#cfd5de;font-size:13px}

const vista=$("#vista"),mundo=$("#mundo");
const cam={x:0,y:0,z:.4};let vuelo=0;
function aplicar(){
  mundo.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  mundo.style.setProperty("--iz",(1/cam.z).toFixed(4));

  vista.style.backgroundSize=`${g}px ${g}px`;vista.style.backgroundPosition=`${cam.x}px ${cam.y}px`;

}
const limZ=z=>Math.min(4,Math.max(.06,z));
function zoomEn(sx,sy,f){cancelAnimationFrame(vuelo);const wx=(sx-cam.x)/cam.z,wy=(sy-cam.y)/cam.z;cam.z=limZ(cam.z*f);cam.x=sx-wx*cam.z;cam.y=sy-wy*cam.z;aplicar()}
function caja(m){const el=document.getElementById("m-"+m.id);return{x:m.x,y:m.y,w:m.w,h:el&&el.offsetHeight?el.offsetHeight:656}}
function cajaTotal(ids){const bs=(ids?MARCOS.filter(m=>ids.includes(m.id)):visibles()).map(caja);
  const x0=Math.min(...bs.map(b=>b.x)),y0=Math.min(...bs.map(b=>b.y))-(ids?0:200),x1=Math.max(...bs.map(b=>b.x+b.w)),y1=Math.max(...bs.map(b=>b.y+b.h));return{x:x0,y:y0,w:x1-x0,h:y1-y0}}
function volarA(b,pad=70,inst=false){
  const W=innerWidth,H=innerHeight,top=56,bot=70,left=innerWidth>900?260:12,right=$("#insp").hidden||innerWidth<640?12:380;
  const z=limZ(Math.min((W-left-right-pad*2)/b.w,(H-top-bot-pad*2)/b.h));
  const tx=left+(W-left-right)/2-(b.x+b.w/2)*z,ty=top+(H-top-bot)/2-(b.y+b.h/2)*z;
  cancelAnimationFrame(vuelo);
  if(inst||quieto){cam.x=tx;cam.y=ty;cam.z=z;aplicar();return}
  const a={...cam},t0=performance.now(),D=520;mundo.classList.add("moviendo");
  const paso=t=>{let k=Math.min(1,(t-t0)/D);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    const za=Math.exp(Math.log(a.z)+(Math.log(z)-Math.log(a.z))*k);cam.z=za;cam.x=a.x+(tx-a.x)*k;cam.y=a.y+(ty-a.y)*k;aplicar();
    if(k<1)vuelo=requestAnimationFrame(paso);else mundo.classList.remove("moviendo")};
  vuelo=requestAnimationFrame(paso);
}
function irAMarco(id){const m=MARCOS.find(x=>x.id===id);if(!m)return;

/* Arrastre, rueda y pellizco */
const punteros=new Map();let arr=null,pinza=null,movido=false;
const interactivo=t=>t.closest("button,a,input,select,textarea,.item,.ganador,.etiqueta,label");
vista.addEventListener("pointerdown",e=>{
  if(e.button!==0&&e.pointerType==="mouse")return;
  if(interactivo(e.target)&&e.pointerType==="mouse")return;
  punteros.set(e.pointerId,{x:e.clientX,y:e.clientY});
  movido=false;cancelAnimationFrame(vuelo);
  if(punteros.size===1){arr={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}}
  if(punteros.size===2){const[p1,p2]=[...punteros.values()];pinza={d:Math.hypot(p2.x-p1.x,p2.y-p1.y),z:cam.z};arr=null}
});
addEventListener("pointermove",e=>{
  if(!punteros.has(e.pointerId))return;punteros.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinza&&punteros.size>=2){const[p1,p2]=[...punteros.values()];const d=Math.hypot(p2.x-p1.x,p2.y-p1.y);
    const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;zoomEn(mx,my,limZ(pinza.z*d/pinza.d)/cam.z);movido=true;return}
  if(arr){const dx=e.clientX-arr.x,dy=e.clientY-arr.y;if(!movido&&Math.hypot(dx,dy)<4)return;
    if(!movido){movido=true;vista.classList.add("arrastrando");mundo.classList.add("moviendo");try{vista.setPointerCapture(e.pointerId)}catch(_){}}
    cam.x=arr.cx+dx;cam.y=arr.cy+dy;aplicar()}
});
function soltar(e){punteros.delete(e.pointerId);if(punteros.size<2)pinza=null;if(!punteros.size){arr=null;vista.classList.remove("arrastrando");mundo.classList.remove("moviendo")}}
addEventListener("pointerup",soltar);addEventListener("pointercancel",soltar);
vista.addEventListener("click",e=>{if(movido){e.stopPropagation();e.preventDefault();movido=false}},true);
vista.addEventListener("wheel",e=>{
  if(e.target.closest("input,select"))return;
  e.preventDefault();
  const raton=!e.ctrlKey&&Math.abs(e.deltaX)<1&&Number.isInteger(e.deltaY)&&Math.abs(e.deltaY)>=50;
  if(e.ctrlKey||e.metaKey||raton)zoomEn(e.clientX,e.clientY,Math.exp(-e.deltaY*(raton?.0016:.01)));
  else{cancelAnimationFrame(vuelo);cam.x-=e.deltaX;cam.y-=e.deltaY;aplicar()}
},{passive:false});
vista.addEventListener("dblclick",e=>{if(interactivo(e.target))return;

  else if(e.key==="1")verTodo();else if(e.key==="0")zoomEn(...c,1/cam.z);

  else if(e.key.toLowerCase()==="c")entrar("competencia");

  else if(e.key.startsWith("Arrow")){const s=60;cam.x+=e.key==="ArrowLeft"?s:e.key==="ArrowRight"?-s:0;cam.y+=e.key==="ArrowUp"?s:e.key==="ArrowDown"?-s:0;aplicar()}
  else return;e.preventDefault();
});

function pintarMapa(){
  const el=$("#mapa");if(!el||!document.getElementById("m-radar"))return;
  const b=cajaTotal(),pad=200,X=b.x-pad,Y=b.y-pad,W=b.w+pad*2,H=b.h+pad*2;
  const vx=-cam.x/cam.z,vy=-cam.y/cam.z,vw=innerWidth/cam.z,vh=innerHeight/cam.z;

  <rect x="${vx}" y="${vy}" width="${vw}" height="${vh}" fill="rgba(61,123,255,.08)" stroke="#3d7bff" stroke-width="${W/130}"/></svg>`;
  el.onclick=ev=>{const r=el.getBoundingClientRect();const s=Math.max(W/r.width,H/r.height);const ox=(r.width*s-W)/2,oy=(r.height*s-H)/2;

}

function crearMundo(cfg){
  const W={...cfg,gente:[],bocas:[],prox:performance.now()+1000+Math.random()*1500};
  W.ruta=(f,t)=>{const c0=W.corr(f),c1=W.corr(t),r=[{x:f.x,y:c0}];
    if(c0!==c1){const mid=(f.x+t.x)/2;const ax=W.pasillos.reduce((b,v)=>Math.abs(v-mid)<Math.abs(b-mid)?v:b);r.push({x:ax,y:c0},{x:ax,y:c1})}
    r.push({x:t.x,y:c1},{x:t.x,y:t.y});return r};
  W.bocadillo=(p,texto,ms)=>{const cont=W.cont;if(!cont)return;if(W.bocas.length>=3)W.bocas.shift().remove();
    const el=document.createElement("div");el.className="bocadillo"+(p.y<110?" abajo":"");
    el.innerHTML=`<b style="color:${p.a.c}">${esc(p.a.n)}</b>${esc(texto)}`;
    el.style.left=Math.min(1040,Math.max(160,p.x*2))+"px";el.style.top=(p.y*2)+"px";
    cont.appendChild(el);W.bocas.push(el);setTimeout(()=>{el.remove();W.bocas=W.bocas.filter(x=>x!==el)},ms)};
  W.gente=cfg.equipo.map((a,i)=>{const[x,y]=cfg.puestos[a.id];const seat={x,y:y+cfg.sillaDy};const el=document.getElementById(cfg.pref+a.id);
    return{a,i,seat,x:seat.x,y:seat.y,r:[],estado:"sentado",hasta:0,el}}).filter(p=>p.el);
  W.planificar=()=>{const libres=W.gente.filter(p=>p.estado==="sentado");if(!libres.length)return;
    const p=azar(libres),r=Math.random();
    if(r<.38){p.estado="ida";p.frase=cfg.fraseReal(p);p.r=W.ruta(p,{x:250+Math.random()*100,y:66})}
    else if(r<.62){const q=azar(W.gente.filter(x=>x!==p));p.estado="ida";const lado=q.seat.x>500?-27:27;p.frase=cfg.visita(p,q);p.r=W.ruta(p,{x:q.seat.x+lado,y:q.seat.y})}
    else if(r<.74){p.estado="ida";p.frase=azar(["Pausa de café","Cinco minutos y sigo","¿Alguien quiere café?"]);p.r=W.ruta(p,cfg.cafe)}
    else W.bocadillo(p,cfg.fraseMesa(p),4600)};
  W.tick=(ts,dt)=>{if(ts>W.prox){W.prox=ts+2800+Math.random()*3800;W.planificar()}
    for(const p of W.gente){
      if(p.r.length){const t=p.r[0],dx=t.x-p.x,dy=t.y-p.y,dist=Math.hypot(dx,dy),v=80*dt;
        if(dist<=v||quieto){p.x=t.x;p.y=t.y;p.r.shift()}else{p.x+=dx/dist*v;p.y+=dy/dist*v}
        if(!p.r.length){if(p.estado==="ida"){p.estado="visita";p.hasta=ts+4200+Math.random()*2400;W.bocadillo(p,p.frase,p.hasta-ts)}
          else if(p.estado==="vuelta")p.estado="sentado"}}
      else if(p.estado==="visita"&&ts>p.hasta){p.estado="vuelta";p.r=W.ruta(p,p.seat)}
      const bob=p.estado==="sentado"&&!quieto?Math.sin(ts/260+p.i*1.7)*.8:0;
      p.el.setAttribute("transform",`translate(${p.x.toFixed(1)} ${(p.y+bob).toFixed(1)})`)}};
  return W;
}
const mundos=[];let rafM=0,ultM=0;
function iniciarMundos(){
  mundos.length=0;
  mundos.push(crearMundo({cont:$("#plano-radar"),equipo:EQUIPO,puestos:PUESTOS,sillaDy:24,pref:"p-",pasillos:PASILLOS,cafe:{x:510,y:262},

  mundos.push(crearMundo({cont:$("#plano-competencia"),equipo:EQUIPO_C,puestos:PUESTOS_C,sillaDy:34,pref:"c-",pasillos:[30,210,390,570],cafe:{x:70,y:262},
    corr:pt=>pt.y<=70?62:pt.y<=170?160:268,fraseReal:fraseRealC,fraseMesa:fraseMesaC,

  ultM=performance.now();cancelAnimationFrame(rafM);
  const loop=ts=>{const dt=Math.min(.05,(ts-ultM)/1000);ultM=ts;mundos.forEach(w=>w.tick(ts,dt));rafM=requestAnimationFrame(loop)};

}

const MC="Metricool Social Media Management",MCT="getAnalyticsDataByMetrics";
const mc={mcp:null,disponible:null,mercado:"es",datos:{},err:{},subs:[]};
const CONSULTAS={
  ytCanal:["YTEV01","YTEV02","YTEV05","YTEV04"],
  ytVideos:["YTVP02","YTVP05","YTVP17","YTVP06","YTVP09","YTVP11","YTVP12","YTVP08"],
  ytComp:["YTCV01","YTCV03","YTCV04","YTCV06","YTCV07","YTCV08","YTCV09"],
  igComp:["IGCP01","IGCP06","IGCP11","IGCP04","IGCP07","IGCP08","IGCP09","IGCP10"],
};
const DENEGADOS=["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","server_not_found"];
function rango(dias){const h=new Date(),f=new Date(h-dias*864e5),d=x=>x.toISOString().slice(0,10);return{from:d(f)+"T00:00:00+00:00",to:d(h)+"T23:59:59+00:00"}}
function suscribirMetricool(){
  mc.subs.forEach(u=>{try{u()}catch(_){}});mc.subs=[];
  const m=MERCADOS.find(x=>x.id===mc.mercado);
  if(mc.mcp&&m.brand){const r=rango(30);
    for(const[k,metrics]of Object.entries(CONSULTAS)){
      if(!m.yt&&k.startsWith("yt"))continue;
      const clave=m.id+":"+k;
      mc.subs.push(mc.mcp.watchTool(MC,MCT,{brandId:m.brand,from:r.from,to:r.to,metrics},ev=>{
        if(ev.type==="data"){const pl=ev.result.payload;mc.datos[clave]={rows:Array.isArray(pl?.rows)?pl.rows:[],at:ev.result.cache?.storedAt||Date.now()};delete mc.err[clave]}
        else{mc.err[clave]=ev.error;if(DENEGADOS.includes(ev.error.code))delete mc.datos[clave]}
        pintarMetricool();
      },{refetchInterval:30*60000}));
    }}
  pintarMetricool();
}
function textoError(e){
  const c=e?.code;
  if(c==="needs_reauth")return"La conexión con Metricool ha caducado. Vuelve a conectarla en claude.ai → Ajustes → Conectores.";
  if(c==="server_not_connected"||c==="server_not_found")return"No tienes el conector de Metricool en esta cuenta. Añádelo en claude.ai → Ajustes → Conectores.";
  if(c==="selection_required")return"Tienes más de una conexión de Metricool. Elige cuál usar en el aviso de claude.ai.";
  if(c==="not_in_manifest")return"Metricool está desactivado para esta página. Actívalo desde el menú de permisos del artifact.";
  if(c==="blocked_by_policy"||c==="approval_required")return"Tu organización no permite esta consulta a Metricool desde aquí.";
  if(c==="tool_error")return"Metricool ha devuelto un error: "+(e.message||"sin detalle");
  if(c==="server_unavailable"||c==="rate_limited")return"Metricool no responde ahora mismo. Se reintentará en la próxima actualización.";
  return"No se pudo leer Metricool ("+(c||"error")+"). Se reintentará en la próxima actualización.";
}
const dur=s=>{s=Math.round(+s||0);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const fechaCorta=t=>{t=String(t||"");return t.length>=8?`${t.slice(6,8)}/${t.slice(4,6)}`:""};
function seccion(clave,titulo,cuerpo,extra=""){
  const d=mc.datos[clave],e=mc.err[clave];
  let h=`<div class="mc-sec"><h3>${titulo}<span>${d?`actualizado ${esc(hace(new Date(d.at).toISOString()))}`:""}${extra}</span></h3>`;
  if(e&&!d)return h+`<div class="aviso err">${esc(textoError(e))}</div></div>`;
  if(!d)return h+`<div class="aviso">Pablo está leyendo Metricool…</div></div>`;
  return h+(e?`<div class="aviso err" style="margin-bottom:10px">${esc(textoError(e))} Mostrando los últimos datos.</div>`:"")+cuerpo(d.rows)+`</div>`;
}
function sparkline(pts){
  if(pts.length<2)return"";const W=400,H=70,max=Math.max(...pts.map(p=>p[1]),1);
  const xy=pts.map((p,i)=>[i/(pts.length-1)*W,H-6-(p[1]/max)*(H-14)]);
  const lin=xy.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const u=xy[xy.length-1];
  return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="M0 ${H-6}H${W}" stroke="#1d232d"/><path d="${lin} L${W} ${H} L0 ${H} Z" fill="#3d7bff" fill-opacity=".14"/><path d="${lin}" fill="none" stroke="#3d7bff" stroke-width="1.6" vector-effect="non-scaling-stroke"/><circle cx="${u[0]}" cy="${u[1]}" r="3" fill="#3d7bff"/></svg>`;
}

/* ---------- Contenido de datos ---------- */
function filtrados(){
  const lim=st.periodo==="todo"?Infinity:+st.periodo*864e5;const q=st.q.trim().toLowerCase();
  const r=st.items.filter(i=>{
    if(st.vista==="guardados"&&!i.guardado)return false;
    if(st.vista==="descartados"?!i.descartado:i.descartado)return false;
    if(st.plat!=="todas"&&i.plataforma!==st.plat)return false;
    if(st.mk!=="todos"&&mercadoDe(i)!==st.mk)return false;
    if(st.soloVideo&&!esVideo(i))return false;
    const f=Date.parse(i.publicado||i.detectado);if(!isNaN(f)&&Date.now()-f>lim)return false;
    if(q&&!`${i.titulo} ${i.resumen} ${i.fuente} ${(i.etiquetas||[]).join(" ")}`.toLowerCase().includes(q))return false;
    return true});
  return r.sort(st.orden==="buzz"?(a,b)=>(b.buzz||0)-(a.buzz||0):st.orden==="interacciones"?porGanador:(a,b)=>Date.parse(b.detectado||0)-Date.parse(a.detectado||0));
}

  for(const id of["vivo","vivoSala"]){const v=document.getElementById(id);if(v){v.classList.toggle("off",!st.conectado);v.textContent=st.conectado?"En directo":"Conectando"}}

    <ol class="bit">${(e.bitacora||[]).slice(0,24).map(b=>{const a=EQUIPO.find(x=>x.n===b.quien);return`<li style="--c:${a?a.c:"#7f8a99"}"><div><time>${esc(hace(b.t))} · ${esc(b.quien||"")}</time>${esc(b.texto)}</div></li>`}).join("")||'<li><div>Aquí verás qué hace cada especialista en cada barrida.</div></li>'}</ol>`;

}

function cerrarInsp(){st.sel=null;$("#insp").hidden=true;document.querySelectorAll(".item.sel").forEach(x=>x.classList.remove("sel"))}

document.addEventListener("click",async e=>{
  if(e.target.closest("#cerrarInsp")){cerrarInsp();return}
  const c=e.target.closest("[data-plat]");if(c){st.plat=c.dataset.plat;st.limite=12;pintarListado();return}
  const mkb=e.target.closest(".chip[data-mk]");if(mkb){st.mk=mkb.dataset.mk;st.limite=12;pintarListado();return}
  if(e.target.closest("#soloVideo")){st.soloVideo=!st.soloVideo;st.limite=12;pintarListado();return}
  const tb=e.target.closest(".tab[data-mcmk]");if(tb){mc.mercado=tb.dataset.mcmk;suscribirMetricool();return}
  if(e.target.id==="verMas"){st.limite+=25;pintarListado();return}
  if(e.target.id==="exportar"){exportar();return}
  const it=e.target.closest(".item[data-id],.ganador[data-id]");
  if(it&&!e.target.closest("a,button")){st.sel=it.dataset.id;document.querySelectorAll(".item").forEach(x=>x.classList.toggle("sel",x.dataset.id===st.sel));pintarInsp();return}
  const a=e.target.closest("[data-acc]");if(!a)return;
  const i=st.items.find(x=>x.id===st.sel);if(!i)return;
  if(a.dataset.acc==="copiar"){
    const m=i.metricas||{};
    const t=`${i.titulo}\n${i.url}\n${PLAT[i.plataforma]?.n||i.plataforma} · ${i.fuente} · buzz ${i.buzz}\n${i.resumen}${i.porque?"\nPor qué funciona: "+i.porque:""}${MET.filter(([k])=>fmt(m[k])).map(([k,l])=>`\n${l}: ${fmt(m[k])}`).join("")}`;
    try{await navigator.clipboard.writeText(t);toast("Ficha copiada")}catch(_){toast("No se pudo copiar en este visor")}return}
  if(!st.db){toast("Sin conexión con la sala");return}
  const campo=a.dataset.acc==="guardar"?"guardado":"descartado";
  try{await st.db.doc("radar/"+i.id).update({[campo]:!i[campo]});toast(campo==="guardado"?(i[campo]?"Quitado de guardados":"Guardado"):(i[campo]?"Recuperado":"Descartado"))}
  catch(_){toast("Solo el propietario puede marcar contenidos")}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){st.q=e.target.value;st.limite=12;clearTimeout(pintarListado.t);pintarListado.t=setTimeout(pintarListado,180)}});
document.addEventListener("change",e=>{if(["periodo","orden","vista"].includes(e.target.id)){st[e.target.id]=e.target.value;st.limite=12;pintarListado()}});

async function exportar(){
  const rows=filtrados();const cols=["buzz","mercado","formato","plataforma","titulo","url","fuente","publicado","detectado","vistas","likes","reacciones","comentarios","compartidos","guardados","seguidores","interacciones","resumen","porque","senales","etiquetas","agente"];
  const q=v=>`"${String(Array.isArray(v)?v.join(" "):v??"").replace(/"/g,'""')}"`;
  const csv="﻿"+[cols.join(";"),...rows.map(r=>cols.map(c=>q(c==="mercado"?mercadoDe(r):c==="interacciones"?(interacciones(r)||""):MET.some(([k])=>k===c)?(r.metricas||{})[c]:r[c])).join(";"))].join("\n");
  if(!st.dl){toast("La descarga no está disponible en este visor");return}
  try{await st.dl.save({filename:`radar-viral-camino-${new Date().toISOString().slice(0,10)}.csv`,data:csv})}catch(err){if(err?.code!=="declined")toast("No se pudo exportar")}
}

  db.collection("players").limit(100).onSnapshot(s=>{st.players=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.orden??99)-(b.orden??99));pintarCompetencia()});
  db.collection("comp_cambios").orderBy("detectado","desc").limit(400).onSnapshot(s=>{st.cambios=s.docs.map(d=>({id:d.id,...d.data()}));pintarCompetencia()});
  db.doc("estado/competencia").onSnapshot(s=>{st.estadoC=s.exists?s.data():null;pintarCompetencia()});
  db.doc("estado/radar").onSnapshot(s=>{st.estado=s.exists?s.data():null;if(document.activeElement?.id!=="q")pintarDatos()});
})();
</script>
